name: Auto-merge Dependabot

on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  automerge:
    name: Auto-merge Dependabot PRs
    runs-on: ubuntu-latest
    steps:
      - name: Auto-merge when checks pass
        uses: pascalgn/automerge-action@v0.15.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          merge_method: squash
          allow_no_reviews: true
          allowed_authors: dependabot[bot]
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
