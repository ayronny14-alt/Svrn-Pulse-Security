[package]
name    = "pulse-core"
version = "0.1.0"
edition = "2021"
description = "WASM entropy probe for @sovereign/pulse"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys        = "0.3"
web-sys       = { version = "0.3", features = ["Performance", "Window"] }

[profile.release]
opt-level     = 3   # maximum speed (we want the timing to be real, not artificially fast)
lto           = true
codegen-units = 1
panic         = "abort"  # smaller WASM binary
